name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Headless Browser
        shell: python
        run: |
          from playwright.sync_api import sync_playwright
          
          url = "https://nhrv40py-lhaxvq38mqh3aav28lzadq.streamlit.app/"
          
          with sync_playwright() as p:
              # Запускаємо невидимий Chrome
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              
              print(f"Відвідуємо {url}...")
              
              try:
                  # Переходимо на сторінку і чекаємо, поки вона повністю завантажиться
                  page.goto(url, wait_until="networkidle", timeout=60000)
                  
                  # Шукаємо кнопку пробудження (як на вашому скріншоті)
                  wake_button = page.locator("button:has-text('Yes, get this app back up!')")
                  
                  if wake_button.is_visible():
                      print("💤 Додаток спить. Натискаємо кнопку пробудження...")
                      wake_button.click()
                      # Чекаємо 10 секунд, щоб сервер Streamlit встиг запустити контейнер
                      page.wait_for_timeout(10000)
                      print("✅ Пробудження ініційовано!")
                  else:
                      print("✅ Додаток активний! З'єднання з JavaScript встановлено.")
                      
              except Exception as e:
                  print(f"⚠️ Виникла помилка під час виконання: {e}")
              finally:
                  browser.close()
