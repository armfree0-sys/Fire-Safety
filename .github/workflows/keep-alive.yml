name: Keep Streamlit App Awake

on:
  schedule:
    # Запускається автоматично кожні 6 годин
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: curl -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" -sSf https://nhrv40py-lhaxvq38mqh3aav28lzadq.streamlit.app/ > /dev/null
